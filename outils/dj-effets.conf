# Instance PipeWire temporaire : égaliseur 3 bandes, passe-haut, écho. Tout est neutre au départ.
# Lancement : pipewire -c outils/dj-effets.conf    (arrêter le processus retire la sortie)
context.modules = [
  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-client-node }
  { name = libpipewire-module-adapter }
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "DJ effets (test)"
      media.name       = "DJ effets (test)"
      filter.graph = {
        nodes = [
          { type = builtin name = low  label = bq_lowshelf  control = { "Freq" = 120.0  "Q" = 0.707 "Gain" = 0.0 } }
          { type = builtin name = mid  label = bq_peaking   control = { "Freq" = 1000.0 "Q" = 0.707 "Gain" = 0.0 } }
          { type = builtin name = high label = bq_highshelf control = { "Freq" = 6000.0 "Q" = 0.707 "Gain" = 0.0 } }
          { type = builtin name = hp   label = bq_highpass  control = { "Freq" = 20.0   "Q" = 0.707 } }
          { type = builtin name = dly  label = delay  config = { "max-delay" = 2.0 } control = { "Delay (s)" = 0.0 } }
          { type = builtin name = mix  label = mixer  control = { "Gain 1" = 1.0 "Gain 2" = 0.0 } }
        ]
        links = [
          { output = "low:Out"  input = "mid:In" }
          { output = "mid:Out"  input = "high:In" }
          { output = "high:Out" input = "hp:In" }
          { output = "hp:Out"   input = "mix:In 1" }
          { output = "hp:Out"   input = "dly:In" }
          { output = "dly:Out"  input = "mix:In 2" }
        ]
        inputs  = [ "low:In" ]
        outputs = [ "mix:Out" ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props  = { node.name = "dj_effets" media.class = Audio/Sink }
      playback.props = { node.name = "dj_effets.output" node.passive = true }
    }
  }
]
